<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hızlı Okuma Modu</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
    --accent: #38bdf8; --accent2: #a78bfa; --border: #334155;
    --highlight: #f43f5e; --success: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    color: var(--text); min-height: 100vh; padding: 20px;
  }
  .container { max-width: 1000px; margin: 0 auto; width: 100%; }
  header { text-align: center; padding: 20px 0 30px; }
  h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  header p { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }

  .panel {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 22px; margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  .upload-area { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; }
  label.file-btn {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #0b1220; font-weight: 700; padding: 12px 22px;
    border-radius: 10px; cursor: pointer; transition: transform 0.15s, opacity 0.15s;
  }
  label.file-btn:hover { transform: translateY(-2px); opacity: 0.9; }
  input[type="file"] { display: none; }
  .hint { color: var(--muted); font-size: 0.85rem; width: 100%; text-align: center; }

  textarea {
    width: 100%; min-height: 110px; background: #0b1220;
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; color: var(--text); font-family: inherit;
    font-size: 0.95rem; resize: vertical; margin-top: 12px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }

  .btn {
    background: rgba(255,255,255,0.06); border: 1px solid var(--border);
    color: var(--text); padding: 10px 18px; border-radius: 10px;
    cursor: pointer; font-weight: 600; font-size: 0.95rem;
    transition: all 0.15s; white-space: nowrap;
  }
  .btn:hover { background: rgba(255,255,255,0.12); border-color: var(--accent); }
  .btn.primary {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #0b1220; border: none;
  }
  .btn.primary:hover { transform: translateY(-2px); }
  .btn.active { background: rgba(56,189,248,0.2); border-color: var(--accent); color: var(--accent); }

  #reader { display: none; }
  .book-title {
    text-align: center; color: var(--muted); font-size: 0.9rem;
    margin-bottom: 14px; font-style: italic; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }

  .reader-display {
    background: #0b1220; border: 1px solid var(--border);
    border-radius: 14px; padding: 40px 10px; position: relative;
    overflow: hidden; min-height: 200px;
    display: flex; align-items: center; justify-content: center;
  }
  .reader-display::before,
  .reader-display::after {
    content: ""; position: absolute; left: 50%; width: 1px; height: 26px;
    background: rgba(56, 189, 248, 0.35); transform: translateX(-0.5px);
    pointer-events: none;
  }
  .reader-display::before { top: 14px; }
  .reader-display::after  { bottom: 14px; }
  #word {
    width: 100%; display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: baseline; font-size: clamp(2rem, 8vw, 4rem);
    font-weight: 800; letter-spacing: 1px; color: #fff;
    font-family: "Courier New", monospace; line-height: 1.2;
  }
  #word span { white-space: pre; }
  .wp-left { text-align: right; }
  .wp-center { color: var(--highlight); }
  .wp-right { text-align: left; }

  .controls {
    display: flex; flex-wrap: wrap; gap: 10px;
    align-items: center; justify-content: center; margin-top: 16px;
  }
  .slider-group {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.04); padding: 10px 16px;
    border-radius: 10px; border: 1px solid var(--border);
  }
  input[type="range"] {
    -webkit-appearance: none; width: 140px; height: 6px;
    background: var(--border); border-radius: 3px; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px;
    background: var(--accent); border-radius: 50%; cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 18px; height: 18px; background: var(--accent);
    border-radius: 50%; cursor: pointer; border: none;
  }
  .value-badge {
    background: rgba(56,189,248,0.15); color: var(--accent);
    padding: 3px 10px; border-radius: 6px; font-weight: 700;
    font-size: 0.9rem; min-width: 78px; text-align: center;
  }

  .progress-bar {
    width: 100%; height: 6px; background: var(--border);
    border-radius: 3px; margin-top: 18px; overflow: hidden;
  }
  #progressFill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.1s linear;
  }
  .stats {
    display: flex; justify-content: space-between; align-items: center;
    color: var(--muted); font-size: 0.85rem; margin-top: 8px;
    gap: 10px; flex-wrap: wrap;
  }
  .pos-input {
    background: #0b1220; border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; color: var(--accent);
    width: 90px; font-family: monospace; font-size: 0.85rem; text-align: center;
  }
  .pos-input:focus { outline: none; border-color: var(--accent); }

  .preview-panel {
    margin-top: 20px; border-top: 1px solid var(--border);
    padding-top: 18px; display: none;
  }
  .preview-panel.open { display: block; }
  .preview-header {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 12px;
  }
  .preview-header h3 { font-size: 1rem; color: #fff; }
  .preview-header small { color: var(--muted); font-weight: 400; }

  .preview-list {
    max-height: 340px; overflow-y: auto;
    border: 1px solid var(--border); border-radius: 10px;
    background: #0b1220; padding: 8px;
  }
  .preview-list::-webkit-scrollbar { width: 8px; }
  .preview-list::-webkit-scrollbar-track { background: transparent; }
  .preview-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .preview-list::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  .seg {
    padding: 8px 12px; border-radius: 8px; cursor: pointer;
    font-size: 0.85rem; color: var(--muted); line-height: 1.5;
    display: flex; gap: 10px;
    transition: background 0.12s, color 0.12s;
    border: 1px solid transparent;
  }
  .seg:hover { background: rgba(56,189,248,0.08); color: var(--text); }
  .seg.active {
    background: rgba(56,189,248,0.15);
    border-color: rgba(56,189,248,0.4); color: #fff;
  }
  .seg-num {
    color: var(--accent); font-family: monospace; font-weight: 700;
    min-width: 36px; flex-shrink: 0; font-size: 0.75rem; padding-top: 2px;
  }
  .seg.active .seg-num { color: var(--highlight); }
  .seg-text {
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }

  .loading-overlay {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(6px); display: none;
    align-items: center; justify-content: center;
    z-index: 100; flex-direction: column; gap: 16px;
  }
  .loading-overlay.show { display: flex; }
  .spinner {
    width: 44px; height: 44px; border: 4px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: var(--text); font-size: 0.95rem; }
  .loading-sub { color: var(--muted); font-size: 0.8rem; }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--card); border: 1px solid var(--accent);
    color: var(--text); padding: 12px 22px; border-radius: 10px;
    font-size: 0.9rem; transition: transform 0.3s;
    z-index: 200; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    max-width: 90%; text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  kbd {
    background: rgba(255,255,255,0.1); padding: 2px 6px;
    border-radius: 4px; font-size: 0.8rem;
    border: 1px solid var(--border); font-family: monospace;
  }
  .shortcuts { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 14px; }

  @media (max-width: 600px) {
    .slider-group { padding: 8px 12px; }
    input[type="range"] { width: 100px; }
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">Yükleniyor...</div>
  <div class="loading-sub" id="loadingSub"></div>
</div>

<div class="toast" id="toast"></div>

<div class="container">
  <header>
    <h1>⚡ Hızlı Okuma Modu</h1>
    <p>PDF veya TXT yükle, kelime kelime oku.</p>
  </header>

  <div class="panel" id="uploadPanel">
    <div class="upload-area">
      <label class="file-btn" for="fileInput">📂 Kitap Yükle (PDF / TXT)</label>
      <input type="file" id="fileInput" accept=".txt,.pdf,text/plain,application/pdf">
      <button class="btn" id="demoBtn">📖 Örnek Metin</button>
      <span class="hint">veya aşağıya metni doğrudan yapıştır:</span>
    </div>
    <textarea id="textInput" placeholder="Metni buraya yapıştırabilirsin..."></textarea>
    <div class="controls">
      <button class="btn primary" id="startBtn">▶ Okumaya Başla</button>
    </div>
  </div>

  <div class="panel" id="reader">
    <div class="book-title" id="bookTitle"></div>

    <div class="reader-display">
      <div id="word">
        <span class="wp-left"></span>
        <span class="wp-center">H</span>
        <span class="wp-right">azır</span>
      </div>
    </div>

    <div class="progress-bar"><div id="progressFill"></div></div>
    <div class="stats">
      <span id="progressText">0 / 0</span>
      <span>Git: <input type="number" class="pos-input" id="posInput" min="1" value="1"></span>
      <span id="timeLeft">~0 dk kaldı</span>
    </div>

    <div class="controls">
      <button class="btn" id="playPauseBtn">⏸ Duraklat</button>
      <button class="btn" id="prevBtn">⏮ Geri</button>
      <button class="btn" id="nextBtn">İleri ⏭</button>
      <button class="btn" id="restartBtn">↺ Baştan</button>
      <button class="btn" id="previewToggle">☰ İçindekiler</button>
      <button class="btn" id="backBtn">← Metni Değiştir</button>
    </div>

    <div class="controls">
      <div class="slider-group">
        <span>Hız</span>
        <input type="range" id="speed" min="100" max="1500" step="25" value="400">
        <span class="value-badge" id="speedVal">400 WPM</span>
      </div>
      <div class="slider-group">
        <span>Kelime Grubu</span>
        <input type="range" id="chunk" min="1" max="4" step="1" value="1">
        <span class="value-badge" id="chunkVal">1 kelime</span>
      </div>
    </div>

    <div class="preview-panel" id="previewPanel">
      <div class="preview-header">
        <h3>📑 İçindekiler <small id="segCount"></small></h3>
        <button class="btn" id="closePreview">✕ Kapat</button>
      </div>
      <div class="preview-list" id="previewList"></div>
    </div>

    <div class="shortcuts">
      <kbd>Space</kbd> Duraklat/Başlat &nbsp; • &nbsp;
      <kbd>←</kbd><kbd>→</kbd> Kelime atla &nbsp; • &nbsp;
      <kbd>↑</kbd><kbd>↓</kbd> Hız değiştir
    </div>
  </div>
</div>

<script>
(() => {
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  const els = {
    uploadPanel: document.getElementById('uploadPanel'),
    reader: document.getElementById('reader'),
    fileInput: document.getElementById('fileInput'),
    textInput: document.getElementById('textInput'),
    startBtn: document.getElementById('startBtn'),
    demoBtn: document.getElementById('demoBtn'),
    bookTitle: document.getElementById('bookTitle'),
    word: document.getElementById('word'),
    playPauseBtn: document.getElementById('playPauseBtn'),
    prevBtn: document.getElementById('prevBtn'),
    nextBtn: document.getElementById('nextBtn'),
    restartBtn: document.getElementById('restartBtn'),
    previewToggle: document.getElementById('previewToggle'),
    backBtn: document.getElementById('backBtn'),
    speed: document.getElementById('speed'),
    speedVal: document.getElementById('speedVal'),
    chunk: document.getElementById('chunk'),
    chunkVal: document.getElementById('chunkVal'),
    progressFill: document.getElementById('progressFill'),
    progressText: document.getElementById('progressText'),
    timeLeft: document.getElementById('timeLeft'),
    posInput: document.getElementById('posInput'),
    previewPanel: document.getElementById('previewPanel'),
    previewList: document.getElementById('previewList'),
    closePreview: document.getElementById('closePreview'),
    segCount: document.getElementById('segCount'),
    loadingOverlay: document.getElementById('loadingOverlay'),
    loadingText: document.getElementById('loadingText'),
    loadingSub: document.getElementById('loadingSub'),
    toast: document.getElementById('toast'),
  };

  const SEG_SIZE = 150;

  const state = {
    words: [], index: 0, chunkSize: 1, wpm: 400,
    playing: false, timer: null, filename: '', segments: [],
  };

  // ---------- Yardımcılar ----------
  function escapeHTML(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function showToast(msg, ms = 2400) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => els.toast.classList.remove('show'), ms);
  }
  function showLoading(text, sub = '') {
    els.loadingText.textContent = text;
    els.loadingSub.textContent = sub;
    els.loadingOverlay.classList.add('show');
  }
  function hideLoading() { els.loadingOverlay.classList.remove('show'); }

  function prepareText(raw) { return raw.replace(/\r/g, '').replace(/\s+/g, ' ').trim(); }
  function splitWords(text) { return text.split(' ').filter(w => w.length > 0); }

  function splitORP(word) {
    const len = word.length;
    let pivot = 0;
    if (len > 1 && len <= 5)         pivot = 1;
    else if (len >= 6 && len <= 9)   pivot = 2;
    else if (len >= 10 && len <= 13) pivot = 3;
    else if (len > 13)               pivot = 4;
    if (pivot >= len) pivot = Math.max(0, len - 1);
    return {
      before: word.slice(0, pivot),
      pivot:  word[pivot] || '',
      after:  word.slice(pivot + 1)
    };
  }

  // ---------- PDF ----------
  async function extractPdfText(arrayBuffer) {
    if (!window.pdfjsLib) throw new Error('PDF kütüphanesi yüklenemedi (internet gerekli)');
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    const numPages = pdf.numPages;
    let fullText = '';

    for (let i = 1; i <= numPages; i++) {
      showLoading(`PDF okunuyor... ${i}/${numPages}`, 'Büyük dosyalar biraz sürebilir');
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      let lastY = null, lineText = '';
      const lines = [];
      for (const item of content.items) {
        if (!item.str) continue;
        const y = item.transform ? item.transform[5] : null;
        if (lastY !== null && y !== null && Math.abs(y - lastY) > 5) {
          lines.push(lineText.trim());
          lineText = item.str;
        } else {
          lineText += (lineText ? ' ' : '') + item.str;
        }
        lastY = y;
      }
      if (lineText.trim()) lines.push(lineText.trim());
      fullText += lines.join(' ').replace(/\s+/g, ' ').trim() + ' ';
      if (i % 5 === 0) await new Promise(r => setTimeout(r, 0));
    }
    return fullText.trim();
  }

  // ---------- Kitap ----------
  function setBook(text, filename) {
    const clean = prepareText(text);
    if (!clean) { alert('Lütfen geçerli bir metin yükleyin.'); return; }
    state.words = splitWords(clean);
    state.index = 0;
    state.filename = filename || 'Yapıştırılan metin';
    buildSegments();

    els.uploadPanel.style.display = 'none';
    els.reader.style.display = 'block';
    els.bookTitle.textContent = `📖 ${state.filename} • ${state.words.length.toLocaleString('tr-TR')} kelime`;

    els.posInput.max = state.words.length;
    render();
    start();
  }

  function buildSegments() {
    state.segments = [];
    const w = state.words;
    for (let i = 0; i < w.length; i += SEG_SIZE) {
      const end = Math.min(i + SEG_SIZE, w.length);
      const previewCount = Math.min(20, end - i);
      const previewWords = w.slice(i, i + previewCount);
      let preview = previewWords.join(' ');
      if (previewCount < (end - i)) preview += ' …';
      state.segments.push({ start: i, end, preview });
    }
  }

  function renderPreview() {
    if (!state.segments.length) {
      els.previewList.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted)">Segment yok</div>';
      return;
    }
    els.segCount.textContent = `(${state.segments.length} bölüm)`;
    const html = state.segments.map((s, i) => {
      const isActive = state.index >= s.start && state.index < s.end;
      return `<div class="seg${isActive ? ' active' : ''}" data-start="${s.start}">
        <span class="seg-num">${i + 1}.</span>
        <span class="seg-text">${escapeHTML(s.preview)}</span>
      </div>`;
    }).join('');
    els.previewList.innerHTML = html;
    const active = els.previewList.querySelector('.seg.active');
    if (active) requestAnimationFrame(() => active.scrollIntoView({ block: 'center' }));
  }

  function updateActiveSegment() {
    const segs = els.previewList.querySelectorAll('.seg');
    if (!segs.length) return;
    let activeEl = null;
    segs.forEach(el => {
      const start = parseInt(el.dataset.start, 10);
      const isActive = state.index >= start && state.index < start + SEG_SIZE;
      el.classList.toggle('active', isActive);
      if (isActive) activeEl = el;
    });
    if (activeEl) {
      const listRect = els.previewList.getBoundingClientRect();
      const elRect = activeEl.getBoundingClientRect();
      if (elRect.top < listRect.top || elRect.bottom > listRect.bottom) {
        activeEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    }
  }

  function render() {
    const { words, index, chunkSize } = state;
    if (!words.length) return;
    const firstWord = words[index] || '';
    const { before, pivot, after } = splitORP(firstWord);
    const restWords = words.slice(index + 1, index + chunkSize);
    const restText = restWords.length ? ' ' + restWords.join(' ') : '';

    els.word.innerHTML =
      `<span class="wp-left">${escapeHTML(before)}</span>` +
      `<span class="wp-center">${escapeHTML(pivot)}</span>` +
      `<span class="wp-right">${escapeHTML(after + restText)}</span>`;

    const pct = (index / Math.max(1, words.length - 1)) * 100;
    els.progressFill.style.width = pct + '%';
    els.progressText.textContent = `${Math.min(index + chunkSize, words.length).toLocaleString('tr-TR')} / ${words.length.toLocaleString('tr-TR')}`;

    const remaining = words.length - index;
    const minutes = remaining / state.wpm;
    if (minutes < 1) els.timeLeft.textContent = `~${Math.ceil(minutes * 60)} sn kaldı`;
    else if (minutes < 60) els.timeLeft.textContent = `~${Math.ceil(minutes)} dk kaldı`;
    else els.timeLeft.textContent = `~${(minutes / 60).toFixed(1)} saat kaldı`;

    els.posInput.value = index + 1;
    if (els.previewPanel.classList.contains('open')) updateActiveSegment();
  }

  function setMessage(text, color) {
    els.word.innerHTML =
      `<span class="wp-left"></span>` +
      `<span class="wp-center" style="color:${color || 'var(--highlight)'}">${escapeHTML(text)}</span>` +
      `<span class="wp-right"></span>`;
  }

  // ---------- Oynatma ----------
  function step() {
    const { words, chunkSize, wpm } = state;
    if (state.index >= words.length) {
      pause();
      setMessage('✓', '#22c55e');
      return;
    }
    render();
    state.index += chunkSize;
    const wordsShown = Math.min(chunkSize, words.length - (state.index - chunkSize));
    const interval = (wordsShown / wpm) * 60 * 1000;
    state.timer = setTimeout(step, interval);
  }
  function start() {
    if (!state.words.length || state.playing) return;
    state.playing = true;
    els.playPauseBtn.textContent = '⏸ Duraklat';
    step();
  }
  function pause() {
    state.playing = false;
    clearTimeout(state.timer);
    els.playPauseBtn.textContent = '▶ Devam Et';
  }
  function togglePlay() {
    if (state.playing) pause();
    else { if (state.index >= state.words.length) state.index = 0; start(); }
  }
  function jump(delta) {
    const wasPlaying = state.playing;
    pause();
    state.index = Math.max(0, Math.min(state.words.length - 1, state.index + delta));
    render();
    if (wasPlaying) start();
  }
  function jumpTo(newIndex) {
    const wasPlaying = state.playing;
    pause();
    state.index = Math.max(0, Math.min(state.words.length - 1, newIndex));
    render();
    if (wasPlaying) start();
  }
  function restart() {
    pause();
    state.index = 0;
    render();
    start();
  }

  // ---------- Event'ler ----------
  els.fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const name = file.name;
    const ext = name.toLowerCase().split('.').pop();
    try {
      if (ext === 'pdf') {
        showLoading('PDF yükleniyor...', name);
        const buf = await file.arrayBuffer();
        const text = await extractPdfText(buf);
        hideLoading();
        setBook(text, name);
        showToast('✓ PDF yüklendi');
      } else {
        const reader = new FileReader();
        reader.onload = (ev) => {
          setBook(ev.target.result, name);
          showToast('✓ Metin yüklendi');
        };
        reader.onerror = () => { hideLoading(); alert('Dosya okunamadı'); };
        reader.readAsText(file, 'UTF-8');
      }
    } catch (err) {
      hideLoading();
      alert('Hata: ' + err.message);
    }
    e.target.value = '';
  });

  els.demoBtn.addEventListener('click', () => {
    els.textInput.value = `Hızlı okuma, metni göz hareketlerini azaltarak ve kelimeleri tek tek ya da küçük gruplar hâlinde sunarak okuma hızını ciddi biçimde artıran bir tekniktir. Klasik okumada gözleriniz satır boyunca sıçrar ve her sıçramada bir miktar zaman kaybedersiniz. Bu uygulama, kelimeleri aynı noktada göstermek suretiyle gözünüzün yapması gereken hareketi neredeyse sıfıra indirir. Kırmızı harf, gözünüzün odaklanması gereken noktayı gösterir ve her zaman ekranın tam ortasında sabit kalır.`;
  });

  els.startBtn.addEventListener('click', () => {
    const text = els.textInput.value.trim();
    if (!text) { alert('Lütfen bir metin yapıştır ya da dosya yükle.'); return; }
    setBook(text, 'Yapıştırılan metin');
  });

  els.playPauseBtn.addEventListener('click', togglePlay);
  els.prevBtn.addEventListener('click', () => jump(-state.chunkSize));
  els.nextBtn.addEventListener('click', () => jump(state.chunkSize));
  els.restartBtn.addEventListener('click', restart);

  els.previewToggle.addEventListener('click', () => {
    const open = els.previewPanel.classList.toggle('open');
    els.previewToggle.classList.toggle('active', open);
    if (open) { pause(); renderPreview(); }
  });
  els.closePreview.addEventListener('click', () => {
    els.previewPanel.classList.remove('open');
    els.previewToggle.classList.remove('active');
  });

  els.previewList.addEventListener('click', (e) => {
    const seg = e.target.closest('.seg');
    if (!seg) return;
    const start = parseInt(seg.dataset.start, 10);
    jumpTo(start);
    updateActiveSegment();
    showToast(`→ ${start + 1}. kelimeden devam`);
  });

  els.posInput.addEventListener('change', (e) => {
    const v = parseInt(e.target.value, 10);
    if (isNaN(v)) return;
    jumpTo(v - 1);
  });
  els.posInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); els.posInput.blur(); }
  });

  els.backBtn.addEventListener('click', () => {
    pause();
    state.index = 0;
    state.words = [];
    els.reader.style.display = 'none';
    els.previewPanel.classList.remove('open');
    els.previewToggle.classList.remove('active');
    els.uploadPanel.style.display = 'block';
  });

  els.speed.addEventListener('input', (e) => {
    state.wpm = parseInt(e.target.value, 10);
    els.speedVal.textContent = state.wpm + ' WPM';
  });
  els.chunk.addEventListener('input', (e) => {
    state.chunkSize = parseInt(e.target.value, 10);
    els.chunkVal.textContent = state.chunkSize + ' kelime';
  });

  document.addEventListener('keydown', (e) => {
    if (els.reader.style.display !== 'block') return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    switch (e.code) {
      case 'Space':      e.preventDefault(); togglePlay(); break;
      case 'ArrowRight': e.preventDefault(); jump(state.chunkSize); break;
      case 'ArrowLeft':  e.preventDefault(); jump(-state.chunkSize); break;
      case 'ArrowUp':
        e.preventDefault();
        els.speed.value = Math.min(1500, state.wpm + 25);
        els.speed.dispatchEvent(new Event('input'));
        break;
      case 'ArrowDown':
        e.preventDefault();
        els.speed.value = Math.max(100, state.wpm - 25);
        els.speed.dispatchEvent(new Event('input'));
        break;
    }
  });
})();
</script>
</body>
</html>
